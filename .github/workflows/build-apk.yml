name: Build Messaging APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify google-services.json present
        run: test -f messaging/app/google-services.json || { echo "missing google-services.json"; exit 1; }

      - name: Build messaging debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :messaging:app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: messaging-debug-apk
          path: messaging/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
